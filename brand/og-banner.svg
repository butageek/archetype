<svg viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Backdrop -->
  <rect width="1200" height="630" fill="#09090B"/>
  
  <!-- Subtle Ambient Glows -->
  <circle cx="600" cy="220" r="320" fill="url(#ambient-mesh)" opacity="0.18"/>
  <defs>
    <radialGradient id="ambient-mesh" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 220) rotate(90) scale(320)">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="monoline-aurora" x1="520" y1="280" x2="680" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Technical Grid -->
  <g opacity="0.06">
    <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M 200 0 V 630 M 400 0 V 630 M 600 0 V 630 M 800 0 V 630 M 1000 0 V 630" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Centered Official Monoline Mark (Size 140x140) -->
  <g transform="translate(530, 110) scale(1.4)">
    <path
      d="M 50 14
         C 56 14 82 50 84 68
         C 86 82 72 86 62 76
         C 52 66 48 54 50 48
         C 52 54 48 66 38 76
         C 28 86 14 82 16 68
         C 18 50 44 14 50 14 Z"
      stroke="#FFFFFF"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 50 48
         C 42 38 42 22 50 22
         C 58 22 58 38 50 48 Z"
      stroke="#FFFFFF"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 24 58
         C 38 48 62 48 76 58"
      stroke="#10B981"
      stroke-width="6.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Typography -->
  <text x="600" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-0.04em" fill="#FFFFFF">ARCHETYPE</text>
  <text x="600" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#A1A1AA">Visual Design Terminology &amp; Prompt Synthesizer for AI Coding Assistants</text>

  <!-- 5 Pillars Pill Badges -->
  <g transform="translate(600, 480)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">
    <rect x="-350" y="-18" width="130" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
    <text x="-285" y="5" text-anchor="middle" fill="#38BDF8">01. PALETTE</text>

    <rect x="-205" y="-18" width="140" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
    <text x="-135" y="5" text-anchor="middle" fill="#818CF8">02. TYPOGRAPHY</text>

    <rect x="-50" y="-18" width="125" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
    <text x="12" y="5" text-anchor="middle" fill="#34D399">03. SURFACE</text>

    <rect x="90" y="-18" width="130" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
    <text x="155" y="5" text-anchor="middle" fill="#FBBF24">04. CONTROLS</text>

    <rect x="235" y="-18" width="125" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
    <text x="297" y="5" text-anchor="middle" fill="#F43F5E">05. ACCENTS</text>
  </g>

  <!-- Footer Tag -->
  <text x="600" y="565" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#71717A">16 CURATED THEMES • 110 MODULAR STYLES • TAILWIND CSS V4</text>
